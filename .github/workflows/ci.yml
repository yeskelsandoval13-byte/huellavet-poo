name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore HuellaVet.sln

      - name: Compilar en Release
        run: dotnet build HuellaVet.sln --configuration Release --no-restore

      - name: Ejecutar pruebas
        run: dotnet test HuellaVet.sln --configuration Release --no-build --verbosity normal

      - name: Ejecutar demostración
        run: dotnet run --project src/HuellaVet.Console --configuration Release --no-build -- --demo --reset
